<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Powered API Generator{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.25.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <style>
        /* VS Code Dark Theme Colors */
        :root {
            --vscode-bg: #1e1e1e;
            --vscode-sidebar: #252526;
            --vscode-panel: #2d2d30;
            --vscode-border: #3e3e42;
            --vscode-text: #cccccc;
            --vscode-text-muted: #969696;
            --vscode-blue: #007acc;
            --vscode-green: #4ec9b0;
            --vscode-purple: #c586c0;
            --vscode-orange: #ce9178;
            --vscode-red: #f44747;
            --vscode-yellow: #ffcc02;
            --vscode-hover: #2a2d2e;
            --vscode-active: #37373d;
        }

        body {
            background-color: var(--vscode-bg);
            color: var(--vscode-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .vscode-panel {
            background-color: var(--vscode-panel);
            border: 1px solid var(--vscode-border);
        }

        .vscode-sidebar {
            background-color: var(--vscode-sidebar);
            border: 1px solid var(--vscode-border);
        }

        .vscode-hover:hover {
            background-color: var(--vscode-hover);
        }

        .vscode-active {
            background-color: var(--vscode-active);
        }

        .vscode-input {
            background-color: var(--vscode-panel);
            border: 1px solid var(--vscode-border);
            color: var(--vscode-text);
        }

        .vscode-input:focus {
            outline: none;
            border-color: var(--vscode-blue);
            box-shadow: 0 0 0 1px var(--vscode-blue);
        }

        .vscode-button {
            background-color: var(--vscode-blue);
            color: white;
            border: none;
            transition: all 0.2s ease;
        }

        .vscode-button:hover {
            background-color: #106bb3;
        }

        .vscode-button:disabled {
            background-color: var(--vscode-border);
            cursor: not-allowed;
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Chat UI Styles */
        .chat-container {
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 70%;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            word-wrap: break-word;
        }

        .message.user {
            background-color: var(--vscode-blue);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant {
            background-color: var(--vscode-panel);
            border: 1px solid var(--vscode-border);
            margin-right: auto;
            border-bottom-left-radius: 0.25rem;
        }

        .message.system {
            background-color: var(--vscode-sidebar);
            border: 1px solid var(--vscode-border);
            margin: 0 auto;
            text-align: center;
            font-size: 0.875rem;
            color: var(--vscode-text-muted);
        }

        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid var(--vscode-border);
            background-color: var(--vscode-sidebar);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--vscode-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--vscode-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-text-muted);
        }

        /* Code blocks */
        pre {
            background-color: var(--vscode-bg) !important;
            border: 1px solid var(--vscode-border) !important;
            border-radius: 0.375rem;
            padding: 1rem;
            overflow-x: auto;
        }

        code {
            background-color: var(--vscode-panel);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="vscode-sidebar border-b border-gray-600 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <!-- Logo and Title -->
                <div class="flex items-center space-x-3">
                    <div class="text-2xl">🤖</div>
                    <div>
                        <h1 class="text-xl font-semibold text-white">AI API Generator</h1>
                        <p class="text-xs text-gray-400">Powered by OpenAI GPT-4</p>
                    </div>
                </div>

                <!-- Navigation -->
                <nav class="hidden md:flex items-center space-x-6">
                    <a href="/" class="text-sm text-gray-300 hover:text-white transition-colors">Generator</a>
                    <a href="/profile" class="text-sm text-gray-300 hover:text-white transition-colors">My APIs</a>
                    <a href="#docs" class="text-sm text-gray-300 hover:text-white transition-colors">Docs</a>
                </nav>

                <!-- Auth Section -->
                <div class="flex items-center space-x-3">
                    <div id="authButtons" class="flex space-x-2">
                        <a href="/login" 
                           class="vscode-button px-3 py-1.5 rounded text-sm font-medium">
                            Login
                        </a>
                        <a href="/register" 
                           class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded text-sm font-medium transition-colors">
                            Register
                        </a>
                    </div>
                    <div id="userMenu" class="hidden flex items-center space-x-3">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-sm font-medium">
                                <span id="userInitials"></span>
                            </div>
                            <span id="welcomeText" class="text-sm text-gray-300"></span>
                        </div>
                        <div class="relative">
                            <button onclick="toggleUserDropdown()" 
                                    class="text-gray-400 hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 vscode-panel rounded-md shadow-lg z-50">
                                <div class="py-1">
                                    <a href="/profile" 
                                       class="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white">
                                        Profile
                                    </a>
                                    <hr class="border-gray-600 my-1">
                                    <button onclick="logout()" 
                                            class="block w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-700 hover:text-red-300">
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="vscode-sidebar border-t border-gray-600 mt-auto">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center text-sm text-gray-400">
                <div class="flex items-center space-x-4 mb-2 md:mb-0">
                    <span>© 2025 AI API Generator</span>
                    <span>•</span>
                    <a href="#" class="hover:text-white transition-colors">Privacy</a>
                    <span>•</span>
                    <a href="#" class="hover:text-white transition-colors">Terms</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span>Built with FastAPI + OpenAI</span>
                    <div class="flex items-center space-x-1">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-xs">Online</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Base JavaScript -->
    <script>
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Initialize user data
        function initializeAuth() {
            const storedUser = localStorage.getItem('currentUser');
            if (authToken && storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                    updateAuthUI();
                } catch (error) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    authToken = null;
                    currentUser = null;
                }
            }
            updateAuthUI();
        }

        function updateAuthUI() {
            if (authToken && currentUser) {
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userMenu').classList.remove('hidden');
                document.getElementById('welcomeText').textContent = currentUser.email;
                
                // Set user initials
                const initials = currentUser.email.substring(0, 2).toUpperCase();
                document.getElementById('userInitials').textContent = initials;
            } else {
                document.getElementById('authButtons').classList.remove('hidden');
                document.getElementById('userMenu').classList.add('hidden');
            }
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('userDropdown');
            const button = event.target.closest('[onclick="toggleUserDropdown()"]');
            if (!button && !dropdown.contains(event.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeAuth);
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
